apiVersion: v1
kind: Pod
metadata:
  name: lab-client
  namespace: resilience-lab
  labels:
    app: lab-client
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/hostname: resilience-lab-worker
  containers:
    - name: lab-client
      image: curlimages/curl:8.18.0
      imagePullPolicy: Never
      command: ["sh", "-c", "while :; do sleep 3600; done"]
      resources:
        requests:
          cpu: 25m
          memory: 16Mi
        limits:
          cpu: 500m
          memory: 64Mi
